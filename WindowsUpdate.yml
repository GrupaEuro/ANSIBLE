```yaml
---
- name: Aktualizacja Windows z automatycznym restartem i kontrolą profilu domenowego
  hosts: Windows
  gather_facts: yes

  vars:
    # Ile razy sprawdzać profil sieciowy.
    domain_profile_retries: 18

    # Odstęp pomiędzy próbami, w sekundach.
    domain_profile_delay: 10

  tasks:
    ###########################################################################
    # WINDOWS UPDATE
    ###########################################################################

    - name: Zainstaluj aktualizacje Windows i automatycznie zrestartuj serwer
      ansible.windows.win_updates:
        category_names:
          - CriticalUpdates
          - SecurityUpdates
          - UpdateRollups
        state: installed
        reboot: yes
        reboot_timeout: 3600
      register: win_update_result
      ignore_errors: yes

    - name: Poczekaj na dostępność serwera po aktualizacjach
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 15
      register: connection_after_updates
      ignore_errors: yes

    - name: Pokaż wynik aktualizacji
      ansible.builtin.debug:
        var: win_update_result

    ###########################################################################
    # PIERWSZE SPRAWDZENIE PROFILU DOMENOWEGO
    ###########################################################################

    - name: Poczekaj na wykrycie profilu DomainAuthenticated
      ansible.windows.win_powershell:
        script: |
          $profiles = @(
              Get-NetConnectionProfile -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPv4Connectivity -notin @(
                      'Disconnected',
                      'NoTraffic'
                  )
              }
          )

          $domainProfiles = @(
              $profiles |
              Where-Object {
                  $_.NetworkCategory -eq 'DomainAuthenticated'
              }
          )

          $Ansible.Result = @{
              DomainDetected = $domainProfiles.Count -gt 0
              Profiles = @(
                  $profiles | ForEach-Object {
                      @{
                          InterfaceAlias    = $_.InterfaceAlias
                          InterfaceIndex    = $_.InterfaceIndex
                          Name              = $_.Name
                          NetworkCategory   = [string]$_.NetworkCategory
                          IPv4Connectivity  = [string]$_.IPv4Connectivity
                          IPv6Connectivity  = [string]$_.IPv6Connectivity
                      }
                  }
              )
          }

          if ($domainProfiles.Count -gt 0) {
              $Ansible.Changed = $false
              $Ansible.Failed = $false
          }
          else {
              $Ansible.Changed = $false
              $Ansible.Failed = $true
          }
      register: initial_domain_profile
      changed_when: false
      failed_when: false
      retries: "{{ domain_profile_retries }}"
      delay: "{{ domain_profile_delay }}"
      until: >-
        initial_domain_profile.result.DomainDetected |
        default(false) |
        bool

    - name: Pokaż profile sieci przed ewentualną naprawą
      ansible.builtin.debug:
        var: initial_domain_profile.result.Profiles

    ###########################################################################
    # NAPRAWA NLA
    ###########################################################################

    - name: Zrestartuj usługę Netlogon
      ansible.windows.win_service:
        name: Netlogon
        state: restarted
      register: netlogon_restart
      failed_when: false
      when: >-
        not (
          initial_domain_profile.result.DomainDetected |
          default(false) |
          bool
        )

    - name: Poczekaj po restarcie usługi Netlogon
      ansible.builtin.pause:
        seconds: 5
      when: >-
        not (
          initial_domain_profile.result.DomainDetected |
          default(false) |
          bool
        )

    - name: Zrestartuj usługę Network Location Awareness
      ansible.windows.win_service:
        name: NlaSvc
        state: restarted
      register: nla_restart
      failed_when: false
      when: >-
        not (
          initial_domain_profile.result.DomainDetected |
          default(false) |
          bool
        )

    - name: Poczekaj na ponowne połączenie po restarcie usług sieciowych
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10
      register: connection_after_nla
      ignore_errors: yes
      when: >-
        not (
          initial_domain_profile.result.DomainDetected |
          default(false) |
          bool
        )

    ###########################################################################
    # KOŃCOWE SPRAWDZENIE PROFILU DOMENOWEGO
    ###########################################################################

    - name: Sprawdź profil sieci po restarcie usług
      ansible.windows.win_powershell:
        script: |
          $profiles = @(
              Get-NetConnectionProfile -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPv4Connectivity -notin @(
                      'Disconnected',
                      'NoTraffic'
                  )
              }
          )

          $domainProfiles = @(
              $profiles |
              Where-Object {
                  $_.NetworkCategory -eq 'DomainAuthenticated'
              }
          )

          $Ansible.Result = @{
              DomainDetected = $domainProfiles.Count -gt 0
              Profiles = @(
                  $profiles | ForEach-Object {
                      @{
                          InterfaceAlias    = $_.InterfaceAlias
                          InterfaceIndex    = $_.InterfaceIndex
                          Name              = $_.Name
                          NetworkCategory   = [string]$_.NetworkCategory
                          IPv4Connectivity  = [string]$_.IPv4Connectivity
                          IPv6Connectivity  = [string]$_.IPv6Connectivity
                      }
                  }
              )
          }

          if ($domainProfiles.Count -gt 0) {
              $Ansible.Changed = $false
              $Ansible.Failed = $false
          }
          else {
              $Ansible.Changed = $false
              $Ansible.Failed = $true
          }
      register: final_domain_profile
      changed_when: false
      failed_when: false
      retries: "{{ domain_profile_retries }}"
      delay: "{{ domain_profile_delay }}"
      until: >-
        final_domain_profile.result.DomainDetected |
        default(false) |
        bool

    - name: Pokaż końcowy status profilu domenowego
      ansible.builtin.debug:
        msg:
          - >-
            Profil domenowy:
            {{
              'OK - DomainAuthenticated'
              if final_domain_profile.result.DomainDetected |
                 default(false) |
                 bool
              else
              'BŁĄD - nie wykryto DomainAuthenticated'
            }}
          - >-
            Restart usług NLA/Netlogon:
            {{
              'wykonano'
              if not (
                initial_domain_profile.result.DomainDetected |
                default(false) |
                bool
              )
              else
              'nie był wymagany'
            }}
          - >-
            Profile:
            {{
              final_domain_profile.result.Profiles |
              default([]) |
              to_json
            }}

  post_tasks:
    ###########################################################################
    # RAPORT E-MAIL
    ###########################################################################

    - name: Przygotuj status wykonania
      ansible.builtin.set_fact:
        update_failed: >-
          {{
            win_update_result.failed |
            default(false) |
            bool
          }}

        domain_profile_detected: >-
          {{
            final_domain_profile.result.DomainDetected |
            default(false) |
            bool
          }}

        network_services_restarted: >-
          {{
            not (
              initial_domain_profile.result.DomainDetected |
              default(false) |
              bool
            )
          }}

        playbook_failed: >-
          {{
            (
              win_update_result.failed |
              default(false) |
              bool
            )
            or
            (
              not (
                final_domain_profile.result.DomainDetected |
                default(false) |
                bool
              )
            )
          }}

    - name: Wyślij raport e-mail
      delegate_to: localhost
      community.general.mail:
        host: "{{ lookup('env', 'SMTP_HOST') }}"
        port: "{{ lookup('env', 'SMTP_PORT') | int }}"
        secure: starttls
        username: "{{ lookup('env', 'SMTP_USER') }}"
        password: "{{ lookup('env', 'SMTP_PASS') }}"
        from: "{{ lookup('env', 'SMTP_FROM') }}"
        to: "{{ lookup('env', 'SMTP_TO') }}"

        subject: >-
          [{{ 'Failed' if playbook_failed else 'Success' }}]
          [{{ lookup('env', 'COMPANY_NAME') }}]
          Windows Update - {{ ansible_hostname }}

        subtype: html

        body: |
          <html>
          <body style="margin:0;padding:0;background:#f3f5f7;font-family:Arial,Helvetica,sans-serif;color:#333;">

            <table width="100%" cellpadding="0" cellspacing="0"
                   style="background:#f3f5f7;padding:24px;">
              <tr>
                <td align="center">

                  <table width="720" cellpadding="0" cellspacing="0"
                         style="background:#ffffff;border:1px solid #d9dde2;">

                    <!-- Nagłówek -->
                    <tr>
                      <td style="
                          background:{{ '#c00000' if playbook_failed else '#00b050' }};
                          color:#ffffff;
                          padding:18px 24px;
                          font-size:22px;
                          font-weight:bold;">
                        Windows Update Report
                      </td>
                    </tr>

                    <!-- Status ogólny -->
                    <tr>
                      <td style="padding:18px 24px;border-bottom:1px solid #e5e8eb;">

                        <span style="
                            display:inline-block;
                            background:{{ '#fdeaea' if playbook_failed else '#e5f6ea' }};
                            color:{{ '#c00000' if playbook_failed else '#107c10' }};
                            border:1px solid {{ '#e0a0a0' if playbook_failed else '#9fd6a8' }};
                            padding:6px 12px;
                            font-weight:bold;">
                          {{ 'FAILED' if playbook_failed else 'SUCCESS' }}
                        </span>

                        <span style="margin-left:12px;color:#666;">
                          {{
                            'Aktualizacja lub kontrola profilu domenowego zakończyła się błędem'
                            if playbook_failed
                            else
                            'Aktualizacja i kontrola profilu domenowego zakończyły się poprawnie'
                          }}
                        </span>

                      </td>
                    </tr>

                    <!-- Informacje o hoście -->
                    <tr>
                      <td style="padding:20px 24px;">

                        <table width="100%" cellpadding="8" cellspacing="0"
                               style="border-collapse:collapse;font-size:14px;">

                          <tr>
                            <td style="
                                width:220px;
                                background:#f7f9fb;
                                border:1px solid #dfe3e8;
                                font-weight:bold;">
                              Host
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{ ansible_hostname }}
                            </td>
                          </tr>

                          <tr>
                            <td style="
                                background:#f7f9fb;
                                border:1px solid #dfe3e8;
                                font-weight:bold;">
                              IP
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{
                                ansible_default_ipv4.address |
                                default(inventory_hostname)
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="
                                background:#f7f9fb;
                                border:1px solid #dfe3e8;
                                font-weight:bold;">
                              System
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{ ansible_distribution | default('Windows') }}
                              {{ ansible_distribution_version | default('') }}
                            </td>
                          </tr>

                        </table>
                      </td>
                    </tr>

                    <!-- Wynik aktualizacji -->
                    <tr>
                      <td style="padding:0 24px 20px 24px;">

                        <table width="100%" cellpadding="8" cellspacing="0"
                               style="border-collapse:collapse;font-size:14px;">

                          <tr>
                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Windows Update
                            </th>

                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Wynik
                            </th>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Znaleziono aktualizacji
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{
                                win_update_result.found_update_count |
                                default(0)
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Zainstalowano aktualizacji
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{
                                win_update_result.installed_update_count |
                                default(0)
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Nieudane aktualizacje
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{
                                win_update_result.failed_update_count |
                                default(0)
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Automatyczny restart wymagany
                            </td>

                            <td style="border:1px solid #dfe3e8;font-weight:bold;">
                              {{
                                'YES'
                                if win_update_result.reboot_required |
                                   default(false) |
                                   bool
                                else
                                'NO'
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Status aktualizacji
                            </td>

                            <td style="
                                border:1px solid #dfe3e8;
                                color:{{ '#c00000' if update_failed else '#107c10' }};
                                font-weight:bold;">
                              {{ 'Failed' if update_failed else 'Success' }}
                            </td>
                          </tr>

                          {% if win_update_result.msg is defined %}
                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Komunikat aktualizacji
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{ win_update_result.msg }}
                            </td>
                          </tr>
                          {% endif %}

                        </table>
                      </td>
                    </tr>

                    <!-- Profil sieciowy -->
                    <tr>
                      <td style="padding:0 24px 20px 24px;">

                        <table width="100%" cellpadding="8" cellspacing="0"
                               style="border-collapse:collapse;font-size:14px;">

                          <tr>
                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Kontrola sieci domenowej
                            </th>

                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Wynik
                            </th>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Profil DomainAuthenticated
                            </td>

                            <td style="
                                border:1px solid #dfe3e8;
                                color:{{ '#107c10' if domain_profile_detected else '#c00000' }};
                                font-weight:bold;">
                              {{
                                'WYKRYTO'
                                if domain_profile_detected
                                else
                                'NIE WYKRYTO'
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Restart usług Netlogon i NlaSvc
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{
                                'WYKONANO'
                                if network_services_restarted
                                else
                                'NIE BYŁ WYMAGANY'
                              }}
                            </td>
                          </tr>

                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              Status końcowy sieci
                            </td>

                            <td style="
                                border:1px solid #dfe3e8;
                                color:{{ '#107c10' if domain_profile_detected else '#c00000' }};
                                font-weight:bold;">
                              {{
                                'Success'
                                if domain_profile_detected
                                else
                                'Failed'
                              }}
                            </td>
                          </tr>

                        </table>
                      </td>
                    </tr>

                    <!-- Profile kart sieciowych -->
                    <tr>
                      <td style="padding:0 24px 20px 24px;">

                        <table width="100%" cellpadding="8" cellspacing="0"
                               style="border-collapse:collapse;font-size:14px;">

                          <tr>
                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Karta sieciowa
                            </th>

                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              Profil
                            </th>

                            <th align="left"
                                style="background:#eef1f4;border:1px solid #dfe3e8;">
                              IPv4
                            </th>
                          </tr>

                          {% for profile in final_domain_profile.result.Profiles | default([]) %}
                          <tr>
                            <td style="border:1px solid #dfe3e8;">
                              {{ profile.InterfaceAlias | default('Nieznana') }}
                            </td>

                            <td style="
                                border:1px solid #dfe3e8;
                                color:{{
                                  '#107c10'
                                  if profile.NetworkCategory | default('') == 'DomainAuthenticated'
                                  else
                                  '#c00000'
                                }};
                                font-weight:bold;">
                              {{ profile.NetworkCategory | default('Nieznany') }}
                            </td>

                            <td style="border:1px solid #dfe3e8;">
                              {{ profile.IPv4Connectivity | default('Nieznany') }}
                            </td>
                          </tr>
                          {% endfor %}

                          {% if final_domain_profile.result.Profiles | default([]) | length == 0 %}
                          <tr>
                            <td colspan="3"
                                style="border:1px solid #dfe3e8;color:#c00000;">
                              Nie znaleziono aktywnych profili sieciowych.
                            </td>
                          </tr>
                          {% endif %}

                        </table>
                      </td>
                    </tr>

                    <!-- Stopka -->
                    <tr>
                      <td style="
                          background:#f7f9fb;
                          border-top:1px solid #dfe3e8;
                          padding:12px 24px;
                          color:#777;
                          font-size:12px;">
                        Report generated automatically by Ansible Semaphore.
                      </td>
                    </tr>

                  </table>
                </td>
              </tr>
            </table>

          </body>
          </html>
      register: mail_result
      ignore_errors: yes

    ###########################################################################
    # KOŃCOWE ZGŁOSZENIE BŁĘDU
    ###########################################################################

    - name: Zakończ playbook błędem, jeśli Windows Update się nie udał
      ansible.builtin.fail:
        msg: >-
          Windows Update na hoście {{ ansible_hostname }} zakończył się błędem:
          {{ win_update_result.msg | default('nieznany błąd') }}
      when: update_failed

    - name: Zakończ playbook błędem, jeśli nie wykryto profilu domenowego
      ansible.builtin.fail:
        msg: >-
          Host {{ ansible_hostname }} po aktualizacjach oraz restarcie usług
          Netlogon i NlaSvc nadal nie posiada aktywnego profilu
          DomainAuthenticated. Aktualne profile:
          {{
            final_domain_profile.result.Profiles |
            default([]) |
            to_json
          }}
      when:
        - not update_failed
        - not domain_profile_detected
```
